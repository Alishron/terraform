name: Terraform deploy

run-name: Deploy ${{ inputs.component }} / ${{ inputs.environment }} / ${{ inputs.deployment_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      component:
        description: Infrastructure component to deploy
        required: true
        type: choice
        options:
          - s3
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      config_json:
        description: Component configuration as a JSON object
        required: true
        type: string
      deployment_id:
        description: Portal deployment identifier (leave blank for a manual run)
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ inputs.component }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Plan and apply Terraform
    runs-on: ubuntu-latest
    env:
      COMPONENT: ${{ inputs.component }}
      ENVIRONMENT: ${{ inputs.environment }}
      CONFIG_JSON: ${{ inputs.config_json }}
      DEPLOYMENT_ID_INPUT: ${{ inputs.deployment_id }}
      TF_STATE_BUCKET: terraform-state-720771544603
      AWS_REGION: us-east-1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::720771544603:role/TerraformGitHubActionsRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$account_id" != "720771544603" ]; then
            echo "::error::OIDC returned an unexpected AWS account."
            exit 1
          fi

      - name: Validate deployment inputs
        id: deployment
        run: |
          case "$COMPONENT" in
            s3) echo "terraform_root=components/s3" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unsupported component."; exit 1 ;;
          esac

          python3 - <<'PY'
          import json
          import os
          import re
          import uuid

          environment = os.environ["ENVIRONMENT"]
          if environment not in {"dev", "staging", "prod"}:
              raise SystemExit("Unsupported environment.")

          raw_config = os.environ["CONFIG_JSON"]
          if len(raw_config.encode("utf-8")) > 16384:
              raise SystemExit("Configuration exceeds the 16 KB limit.")

          try:
              config = json.loads(raw_config)
          except json.JSONDecodeError as error:
              raise SystemExit("Configuration must be valid JSON.") from error

          if not isinstance(config, dict) or set(config) != {"bucket_prefix"}:
              raise SystemExit("The s3 component accepts only the required bucket_prefix value.")

          bucket_prefix = config["bucket_prefix"]
          if not isinstance(bucket_prefix, str) or not re.fullmatch(r"[a-z0-9][a-z0-9-]{1,35}[a-z0-9]", bucket_prefix):
              raise SystemExit("bucket_prefix must be 3-37 lowercase letters, numbers, or hyphens and start/end with a letter or number.")

          deployment_id = os.environ["DEPLOYMENT_ID_INPUT"].strip()
          if deployment_id:
              try:
                  deployment_id = str(uuid.UUID(deployment_id))
              except ValueError as error:
                  raise SystemExit("deployment_id must be a UUID.") from error
          else:
              deployment_id = str(uuid.uuid4())

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as github_env:
              github_env.write(f"TF_VAR_bucket_prefix={bucket_prefix}\n")
              github_env.write(f"TF_VAR_environment={environment}\n")
              github_env.write(f"DEPLOYMENT_ID={deployment_id}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Terraform deployment\n")
              summary.write(f"- Deployment ID: `{deployment_id}`\n")
              summary.write(f"- Component: `{os.environ['COMPONENT']}`\n")
              summary.write(f"- Environment: `{environment}`\n")
          PY

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Prepare remote state key
        id: state
        run: |
          state_key="states/${COMPONENT}/${ENVIRONMENT}/terraform.tfstate"
          echo "state_key=$state_key" >> "$GITHUB_OUTPUT"
          if [ "$COMPONENT" = "s3" ] && [ "$ENVIRONMENT" = "dev" ]; then
            legacy_key="component/terraform.tfstate"
            if aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$legacy_key" >/dev/null 2>&1 \
              && ! aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$state_key" >/dev/null 2>&1; then
              aws s3 cp "s3://${TF_STATE_BUCKET}/${legacy_key}" "s3://${TF_STATE_BUCKET}/${state_key}"
            fi
          fi

      - name: Initialize Terraform
        working-directory: components/s3
        run: >-
          terraform init -input=false -no-color
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="key=${{ steps.state.outputs.state_key }}"
          -backend-config="region=${AWS_REGION}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Validate Terraform
        working-directory: components/s3
        run: terraform validate -no-color

      - name: Plan Terraform changes
        working-directory: components/s3
        run: terraform plan -input=false -no-color -lock-timeout=5m

      - name: Apply Terraform changes
        working-directory: components/s3
        run: terraform apply -auto-approve -input=false -no-color -lock-timeout=5m